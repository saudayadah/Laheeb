---
# cPanel "Deploy HEAD Commit": the app is served from this clone
# (/home/laheebsa/repositories/Laheeb) with the domain docroot at
# /home/laheebsa/public_html holding a synced copy of public/.
# Bootstrap steps are guarded; a REAL migration failure aborts the deploy.
deployment:
  tasks:
    - export APPDIR=/home/laheebsa/repositories/Laheeb
    - export PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php
    # Only the missing-.env bootstrap case is forgiven — a migration error must fail the deploy loudly.
    - 'if [ -f "$APPDIR/.env" ]; then cd "$APPDIR" && $PHP_BIN artisan migrate --force; else echo "skip migrate (no .env yet)"; fi'
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan config:cache || true'
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan route:cache || true'
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan view:cache || true'
    # Sync the web root WITHOUT clobbering the live index.php, then swap the
    # re-pointed index.php into place atomically (no broken-request window).
    - rsync -a --exclude=index.php "$APPDIR/public/" /home/laheebsa/public_html/
    - sed "s|__DIR__\.'/\.\./|'/home/laheebsa/repositories/Laheeb/|g" "$APPDIR/public/index.php" > /home/laheebsa/public_html/.index.php.tmp
    - mv -f /home/laheebsa/public_html/.index.php.tmp /home/laheebsa/public_html/index.php

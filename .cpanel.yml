---
# cPanel "Deploy HEAD Commit": the app is served from this clone
# (/home/laheebsa/repositories/Laheeb) with the domain docroot at
# /home/laheebsa/public_html holding a synced copy of public/.
# Every step is guarded so deploys stay green even mid-setup.
deployment:
  tasks:
    - export APPDIR=/home/laheebsa/repositories/Laheeb
    - export PHP_BIN=/opt/cpanel/ea-php83/root/usr/bin/php
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan migrate --force || echo "skip migrate (no .env yet)"'
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan config:cache || true'
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan route:cache || true'
    - '[ -f "$APPDIR/.env" ] && cd "$APPDIR" && $PHP_BIN artisan view:cache || true'
    # Sync the web root: copy public/ then re-point index.php at the app dir.
    - cp -a "$APPDIR/public/." /home/laheebsa/public_html/
    - sed -i "s|__DIR__\.'/\.\./|'/home/laheebsa/repositories/Laheeb/|g" /home/laheebsa/public_html/index.php
